name: Source tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows-cpu:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-win-cpu.lock
      - name: Install locked CPU dependencies
        run: python -m pip install --require-hashes --only-binary=:all: -r requirements-win-cpu.lock
      - name: Check dependencies
        run: python -m pip check
      - name: Check environment
        run: python scripts/verify_project.py --environment-only
      - name: Run source and available integration tests
        run: python -m unittest discover -s tests -v
